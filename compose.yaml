services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: terrarila
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: terrarila
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - terrarila_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U terrarila -d terrarila']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  terrarila_postgres:
